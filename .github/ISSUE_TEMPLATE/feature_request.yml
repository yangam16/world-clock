name: Feature request / 功能建议
description: Describe a user need and a proposed improvement.
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: User need / 使用需求
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context / 替代方案及补充说明
